name: riconciliare-e-volantino
expected_outcome: |
  La differenza fra il registro (20,00 €) e il riepilogo dell'ente ospitante (44,50 €) è spiegata per
  intero: una donazione di 30,00 € e una commissione di 2,50 € che mancano nel registro, e una fattura
